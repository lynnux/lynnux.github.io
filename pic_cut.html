<html lang="zh-CN" data-immersive-translate-page-theme="light"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>轻封面 · 自媒体封面裁切工具 - uyon.优用</title>
    <link rel="stylesheet" href="./轻封面 · 自媒体封面裁切工具 - uyon.优用_files/all.min.css">
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ===== 主容器 ===== */
        .app-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            max-width: 1440px;
            width: 100%;
            height: calc(100vh - 120px);
            min-height: 600px;
            align-items: stretch;
        }

        /* ===== 左侧画布区 ===== */
        .canvas-section {
            flex: 1.2;
            background: #0f172a;
            border-radius: 28px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
            min-width: 0;
        }

        .canvas-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0f1a;
            border-radius: 20px;
            overflow: auto;
            position: relative;
            min-height: 280px;
        }

        #coverCanvas {
            display: block;
            background: #1e293b;
            cursor: grab;
            touch-action: none;
            user-select: none;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.40);
            border-radius: 12px;
        }

        /* ===== 右侧编辑区 ===== */
        .editor-section {
            width: 420px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }

        /* ===== 标签栏 — 居中均分，只有两个tab ===== */
        .pc-tab-bar {
            background: #ffffff;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 8px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            flex-shrink: 0;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }

        .pc-tab-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            border: none;
            padding: 10px 12px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            transition: 0.2s;
            cursor: pointer;
            white-space: nowrap;
            min-width: 0;
        }
        .pc-tab-item i {
            font-size: 17px;
            flex-shrink: 0;
        }
        .pc-tab-item.active {
            color: #2563eb;
            background: #eff6ff;
        }
        .pc-tab-item:hover:not(.active) {
            background: #f1f5f9;
        }

        /* ===== 面板容器 ===== */
        .panel-container {
            flex: 1;
            background: #ffffff;
            border-radius: 28px;
            border: 1px solid #e2e8f0;
            overflow-y: auto;
            padding: 20px 24px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
        }

        .control-pane {
            display: none;
            flex-direction: column;
            gap: 14px;
            height: 100%;
        }
        .control-pane.active-pane {
            display: flex;
        }

        /* ===== 通用组件 ===== */
        .section-title {
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f172a;
            padding-bottom: 4px;
        }
        .section-title i {
            color: #2563eb;
            width: 26px;
            font-size: 1.15rem;
        }

        /* ===== 比例按钮网格 ===== */
        .ratio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 2px 0 2px 0;
        }

        .ratio-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 60px;
            padding: 10px 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.15s;
            color: #1e293b;
        }
        .ratio-btn i {
            font-size: 0.9rem;
        }
        .ratio-btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .ratio-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
        }
        .ratio-btn.active i {
            color: #ffffff;
        }

        /* ===== 尺寸输入 ===== */
        .dimension-input {
            display: flex;
            gap: 14px;
            margin: 4px 0 2px 0;
        }
        .dim-item {
            flex: 1;
        }
        .dim-item label {
            font-size: 12px;
            color: #475569;
            margin-bottom: 4px;
            display: block;
            font-weight: 500;
        }
        .dim-item input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 60px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            background: #fafcfc;
            transition: 0.15s;
        }
        .dim-item input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        /* ===== 锁定比例 ===== */
        .lock-ratio {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            font-size: 0.85rem;
            color: #2563eb;
            font-weight: 500;
            padding: 2px 0 4px 0;
        }
        .lock-ratio input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .lock-ratio label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== 上传区域 ===== */
        .upload-area {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 18px 16px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
            transition: 0.2s;
            margin: 2px 0 2px 0;
        }
        .upload-area:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .upload-area i {
            color: #2563eb;
            margin-right: 8px;
        }

        /* ===== 按钮 ===== */
        .action-btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 60px;
            padding: 12px 18px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.15s;
            font-size: 0.9rem;
            color: #1e293b;
            width: 100%;
        }
        .action-btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
        .action-btn.primary {
            background: #2563eb;
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
        }
        .action-btn.primary:hover {
            background: #1d4ed8;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.30);
        }

        /* ===== 提示条（通用） ===== */
        .info-hint {
            background: #f8fafc;
            border-radius: 16px;
            padding: 10px 16px;
            border-left: 4px solid #94a3b8;
            font-size: 0.78rem;
            line-height: 1.5;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .info-hint i {
            color: #2563eb;
            font-size: 0.9rem;
        }
        .info-hint.success {
            border-left-color: #10b981;
        }
        .info-hint.success i {
            color: #10b981;
        }
        .info-hint.warning {
            border-left-color: #f59e0b;
        }
        .info-hint.warning i {
            color: #f59e0b;
        }

        /* ===== Toast ===== */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 0.9rem;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.20);
        }

        /* ===== 安全区消息 ===== */
        #safetyMessage {
            margin-top: 0;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1100px) {
            .editor-section {
                width: 360px;
            }
            .ratio-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 860px) {
            body {
                padding: 12px;
            }
            .app-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                gap: 16px;
            }
            .canvas-section {
                flex: none;
                min-height: 260px;
                padding: 14px;
                border-radius: 24px;
            }
            .canvas-wrapper {
                min-height: 200px;
            }
            #coverCanvas {
                max-height: 45vh;
            }
            .editor-section {
                width: 100%;
                flex-shrink: 1;
            }
            .panel-container {
                max-height: 50vh;
                padding: 16px 18px;
            }
            .ratio-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .pc-tab-item {
                padding: 8px 10px;
                font-size: 13px;
            }
            .pc-tab-item span {
                display: inline;
            }
            .dimension-input {
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .ratio-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .pc-tab-item i {
                font-size: 14px;
            }
            .pc-tab-item {
                padding: 6px 8px;
                font-size: 12px;
            }
            .panel-container {
                padding: 14px 14px;
            }
            .section-title {
                font-size: 0.95rem;
            }
            .action-btn {
                padding: 10px 14px;
                font-size: 0.8rem;
            }
            .upload-area {
                padding: 14px 12px;
                font-size: 0.8rem;
            }
            .dim-item input {
                padding: 8px 10px;
                font-size: 0.85rem;
            }
        }
    </style>

<body>

<div class="app-container">
    <!-- ===== 左侧画布 ===== -->
    <div class="canvas-section">
        <div class="canvas-wrapper">
            <canvas id="coverCanvas" width="1600" height="1200"></canvas>
        </div>
    </div>

    <!-- ===== 右侧编辑区 ===== -->
    <div class="editor-section">
        <!-- 标签栏 — 只有两个tab：尺寸&背景 / 导出 -->
        <div class="pc-tab-bar">
            <button class="pc-tab-item" data-pane="tabEditor"><i class="fas fa-expand-alt"></i><span>尺寸 · 背景</span></button>
            <button class="pc-tab-item active" data-pane="tabExport"><i class="fas fa-download"></i><span>导出</span></button>
        </div>

        <!-- 面板 -->
        <div class="panel-container">
            <!-- ======== 编辑器面板 (尺寸 + 背景) ======== -->
            <div class="control-pane" id="tabEditor">
                <div class="section-title"><i class="fas fa-expand-alt"></i> 封面尺寸</div>

                <div class="ratio-grid" id="ratioGrid">
                    <button class="ratio-btn" data-ratio="16:9"><i class="fas fa-tv"></i> 16:9</button>
                    <button class="ratio-btn" data-ratio="9:16"><i class="fas fa-mobile-alt"></i> 9:16</button>
                    <button class="ratio-btn active" data-ratio="4:3"><i class="fas fa-camera"></i> 4:3</button>
                    <button class="ratio-btn" data-ratio="3:4"><i class="fas fa-portrait"></i> 3:4</button>
                    <button class="ratio-btn" data-ratio="2.35:1"><i class="fas fa-film"></i> 2.35:1</button>
                    <button class="ratio-btn" data-ratio="1:1"><i class="fas fa-square"></i> 1:1</button>
                </div>

                <!-- 尺寸输入 + 锁定比例 (无额外文字提示) -->
                <div class="dimension-input">
                    <div class="dim-item">
                        <label>宽度 (px)</label>
                        <input type="number" id="widthInput">
                    </div>
                    <div class="dim-item">
                        <label>高度 (px)</label>
                        <input type="number" id="heightInput">
                    </div>
                </div>

                <div class="lock-ratio">
                    <input type="checkbox" id="lockRatio" checked="">
                    <label><i class="fas fa-link"></i> 锁定宽高比</label>
                </div>

                <!-- 分割线：背景上传区域整合在此 -->
                <div style="margin-top: 6px; border-top: 1px solid #e9edf3;"></div>
                <div class="section-title" style="margin-top: 6px;"><i class="fas fa-cloud-upload-alt"></i> 背景图</div>

                <div class="upload-area" id="bgUploadArea">
                    <i class="fas fa-folder-open"></i> 从电脑 / 相册选择
                </div>

                <button class="action-btn" id="resetBgBtn">
                    <i class="fas fa-sync-alt"></i> 重置背景位置
                </button>

                <div class="info-hint">
                    <i class="fas fa-arrows-alt"></i> 拖拽图片可移动位置，灵活构图
                </div>
            </div>

            <!-- ======== 导出面板 ======== -->
            <div class="control-pane active-pane" id="tabExport">
                <div class="section-title"><i class="fas fa-download"></i> 导出与安全</div>

                <button class="action-btn primary" id="exportBtn">
                    <i class="fas fa-download"></i> 导出 PNG 图片
                </button>

                <button class="action-btn" id="checkSafetyBtn">
                    <i class="fas fa-shield-alt"></i> 验证安全区
                </button>

                <div id="safetyMessage" class="info-hint success">
                    <i class="fas fa-check-circle"></i> 无文字元素，安全区内无遮挡
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const hostname = window.location.hostname;
        const allowed = ['uyon.cn', 'www.uyon.cn', 'localhost', '127.0.0.1'];
        if (!(window.location.protocol === 'file:' || allowed.includes(hostname))) {
            window.location.href = 'https://uyon.cn/';
        }
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
            }
        });
    })();

    (function(){
        const canvas = document.getElementById('coverCanvas');
        const ctx = canvas.getContext('2d');

        // ===== 状态 =====
        let width = 1920, height = 1080;
        let bgImage = null, bgImageNaturalW = 0, bgImageNaturalH = 0;
        let bgOffsetX = 0, bgOffsetY = 0, bgDrawW = 0, bgDrawH = 0;

        // ===== DOM 引用 =====
        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');
        const lockRatioCheck = document.getElementById('lockRatio');
        const ratioBtns = document.querySelectorAll('.ratio-btn');
        const bgUploadArea = document.getElementById('bgUploadArea');
        const resetBgBtn = document.getElementById('resetBgBtn');
        const exportBtn = document.getElementById('exportBtn');
        const checkSafetyBtn = document.getElementById('checkSafetyBtn');
        const safetyMessage = document.getElementById('safetyMessage');

        // ===== 比例配置（2.35:1 宽度改为 1920） =====
        const ratioMap = {
            '16:9':   { w: 1920, h: 1080 },
            '9:16':   { w: 1080, h: 1920 },
            '4:3':    { w: 1600, h: 1200 },
            '3:4':    { w: 1200, h: 1600 },
            '2.35:1': { w: 1920, h: 817 },
            '1:1':    { w: 1400, h: 1400 }
        };

        let currentRatio = '16:9';

        // ===== 工具函数 =====
        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2200);
        }

        // ===== 背景计算 =====
        function recalcBgAfterResize() {
            if (!bgImage) return;
            const imgW = bgImageNaturalW, imgH = bgImageNaturalH;
            const canvasRatio = width / height;
            const imgRatio = imgW / imgH;
            if (imgRatio > canvasRatio) {
                bgDrawH = height;
                bgDrawW = imgW * (height / imgH);
            } else {
                bgDrawW = width;
                bgDrawH = imgH * (width / imgW);
            }
            bgOffsetX = (bgDrawW - width) / 2;
            bgOffsetY = (bgDrawH - height) / 2;
            constrainBg();
        }

        function constrainBg() {
            const maxX = Math.max(0, bgDrawW - width);
            const maxY = Math.max(0, bgDrawH - height);
            bgOffsetX = Math.min(maxX, Math.max(0, bgOffsetX));
            bgOffsetY = Math.min(maxY, Math.max(0, bgOffsetY));
        }

        // ===== 绘制 =====
        function drawCanvas() {
            canvas.width = width;
            canvas.height = height;

            if (bgImage && bgImage.complete && bgImage.naturalWidth > 0) {
                ctx.drawImage(bgImage, -bgOffsetX, -bgOffsetY, bgDrawW, bgDrawH);
            } else {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#94a3b8';
                let fs = Math.min(56, Math.max(24, width / 22));
                ctx.font = `${fs}px system-ui`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('点击「尺寸·背景」上传图片', width / 2, height / 2);
            }

            // 安全区虚线框
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.45)';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 14]);
            const mx = width * 0.10, my = height * 0.10;
            ctx.strokeRect(mx, my, width - mx * 2, height - my * 2);
            ctx.setLineDash([]);
            ctx.restore();
        }

        // ===== 设置比例 =====
        function setRatio(ratioKey) {
            const p = ratioMap[ratioKey];
            if (!p) return;
            width = p.w;
            height = p.h;
            widthInput.value = width;
            heightInput.value = height;

            ratioBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.ratio === ratioKey);
            });

            currentRatio = ratioKey;
            recalcBgAfterResize();
            drawCanvas();
        }

        // ===== 比例按钮点击 =====
        ratioBtns.forEach(btn => {
            btn.addEventListener('click', () => setRatio(btn.dataset.ratio));
        });

        // ===== 宽高输入 =====
        widthInput.addEventListener('input', function() {
            let w = parseInt(this.value) || 100;
            if (w < 10) w = 10;
            width = w;
            if (lockRatioCheck.checked) {
                const ratio = ratioMap[currentRatio].w / ratioMap[currentRatio].h;
                height = Math.round(width / ratio);
                heightInput.value = height;
            }
            recalcBgAfterResize();
            drawCanvas();
        });

        heightInput.addEventListener('input', function() {
            let h = parseInt(this.value) || 100;
            if (h < 10) h = 10;
            height = h;
            if (lockRatioCheck.checked) {
                const ratio = ratioMap[currentRatio].w / ratioMap[currentRatio].h;
                width = Math.round(height * ratio);
                widthInput.value = width;
            }
            recalcBgAfterResize();
            drawCanvas();
        });

        // ===== 背景上传 =====
        function handleBgFile(file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    bgImage = img;
                    bgImageNaturalW = img.width;
                    bgImageNaturalH = img.height;
                    recalcBgAfterResize();
                    drawCanvas();
                    showToast('背景已应用', 'success');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        bgUploadArea.addEventListener('click', () => {
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.accept = 'image/*';
            inp.onchange = (e) => {
                if (e.target.files[0]) handleBgFile(e.target.files[0]);
            };
            inp.click();
        });

        // ===== 重置背景 =====
        resetBgBtn.addEventListener('click', () => {
            if (bgImage) {
                recalcBgAfterResize();
                drawCanvas();
                showToast('背景已重置', 'success');
            } else {
                showToast('暂无背景图片', 'info');
            }
        });

        // ===== 拖拽背景 =====
        let isDragging = false;
        let dragMode = null;
        let dragStartX = 0, dragStartY = 0;
        let dragBgStartX = 0, dragBgStartY = 0;

        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function onPointerDown(e) {
            e.preventDefault();
            if (!bgImage) return;
            let clientX, clientY;
            if (e.touches) {

                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const pos = getCanvasCoords(clientX, clientY);
            dragMode = 'bg';
            dragStartX = pos.x;
            dragStartY = pos.y;
            dragBgStartX = bgOffsetX;
            dragBgStartY = bgOffsetY;
            isDragging = false;
        }

        function onPointerMove(e) {
            if (dragMode !== 'bg') return;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const pos = getCanvasCoords(clientX, clientY);
            const dx = pos.x - dragStartX;
            const dy = pos.y - dragStartY;
            if (!isDragging && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
                isDragging = true;
            }
            if (!isDragging) return;
            bgOffsetX = dragBgStartX - dx;
            bgOffsetY = dragBgStartY - dy;
            constrainBg();
            drawCanvas();
        }

        function onPointerUp() {
            dragMode = null;
            isDragging = false;
        }

        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerUp);

        checkSafetyBtn.addEventListener('click', () => {
            safetyMessage.className = 'info-hint success';
            safetyMessage.innerHTML = '<i class="fas fa-check-circle"></i> 无文字元素，安全区内无遮挡';
            showToast('安全区验证通过', 'success');
        });

        // ===== 导出 =====
        exportBtn.addEventListener('click', () => {
            const off = document.createElement('canvas');
            off.width = width;
            off.height = height;
            const offCtx = off.getContext('2d');

            if (bgImage && bgImage.complete && bgImage.naturalWidth > 0) {
                offCtx.drawImage(bgImage, -bgOffsetX, -bgOffsetY, bgDrawW, bgDrawH);
            } else {
                offCtx.fillStyle = '#2d3a4a';
                offCtx.fillRect(0, 0, width, height);
            }

            off.toBlob(blob => {
                const link = document.createElement('a');
                link.download = `cover_${currentRatio}_${width}x${height}.png`;
                link.href = URL.createObjectURL(blob);
                link.click();
                URL.revokeObjectURL(link.href);
                showToast('导出成功！', 'success');
            }, 'image/png');
        });

        // ===== 标签切换 =====
        const tabs = document.querySelectorAll('.pc-tab-item');
        const panes = document.querySelectorAll('.control-pane');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const targetId = tab.dataset.pane;
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                panes.forEach(p => p.classList.remove('active-pane'));
                document.getElementById(targetId).classList.add('active-pane');
            });
        });

        // ===== 初始化 =====
        setRatio('16:9');
    })();

  from {

    transform: translateY(10px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateY(10px) scale(0.95);
  }
}
